# tincstack config — one self-contained file for all your networks
# (docs/config-schema.md). Put this next to tincmgr.exe as "tinc.yaml" and run.
#
# Everything is optional: an EMPTY file is valid. On the first Start the daemon
# fills in Name, Mode, Port, AddressPool, this node's Subnet and its keys.

networks:

  # ---- a founding node -------------------------------------------------------
  mynet:
    autostart: true            # bring this up automatically on launch

    options:                   # -> tinc.conf (scalar = one line, list = many)
      Name: mybox              # this node's name (must match a hosts: entry)
      Mode: router
      Port: 655                # founding node keeps 655; invitees get 0 (ephemeral)
      AddressPool: 10.210.0.0/24   # invitees are assigned addresses from here
      LocalDiscovery: yes      # find peers on the same LAN (direct, no hairpin)
      UDPRebindOnWake: yes     # re-punch UDP after sleep/resume (core feature)
      DeviceType: wintun       # wintun (L3, auto adapter) or tap
      WintunAddress: 10.210.0.1/24   # auto-assigned to the tunnel adapter

      # transport negotiation (ARCHITECTURE §4) — all optional
      # Transports: [plain, obfs, https, quic]   # ACCEPT list (default: all)
      # PreferredTransports: [quic, plain]       # DIAL preference (default: plain)
      # HttpsFront: yes                          # TLS front on the listen port
      # HttpsFrontPort: 443
      # TlsCert: C:/certs/fullchain.pem          # real cert; absent = self-signed
      # TlsKey:  C:/certs/privkey.pem
      # QuicPort: 443
      # ObfsJunkPacketCount: 4                   # obfuscated-UDP tier

    keys:                      # generated by the daemon on first start if absent;
      ed25519_priv: ""         # or paste existing PEM private keys here
      rsa_priv: ""

    hosts:                     # one entry per node (this node + every peer);
      mybox: |                 # peers learned via invitations are added by the daemon
        Ed25519PublicKey = <this-node-ed25519-public-key>
        Subnet = 10.210.0.1/32
