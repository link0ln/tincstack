# tincstack Linux node -- released build, pulled from the GitHub Container
# Registry. Nothing is compiled here; the image is what the `release` workflow
# built and smoke-tested for the tag it is named after.
#
#   export COMPOSE_FILE=compose.release.yml   # invite.sh / join.sh honour this
#   TINCSTACK_VERSION=v0.1.0 docker compose up -d
#   ./invite.sh <name>                        # one-line invitation for a peer
#   ./join.sh <invitation>                    # on the other host
#
# docker-compose.yml next to this file is the source-tree variant: it BUILDS
# the core and the node image from this checkout. Use that one when you are
# working on tincstack, this one when you are running it.
#
# TINCSTACK_VERSION selects the release (default `latest`). TINCSTACK_IMAGE
# overrides the whole reference, e.g. for a private mirror. Everything else is
# the same deploy-time environment docker-compose.yml takes (.env.example).
name: tincstack

services:
  node:
    image: ${TINCSTACK_IMAGE:-ghcr.io/link0ln/tincstack/node:${TINCSTACK_VERSION:-latest}}
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NETNAME: ${NETNAME:-tincstack}
      NODE_NAME: ${NODE_NAME:-}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      PORT: ${PORT:-}
      INVITE: ${INVITE:-}
      LOG_LEVEL: ${LOG_LEVEL:-1}
    ports:
      # A founding node must be reachable here; an invitee dials out and needs
      # no published port (leave PORT unset, the mapping is then inert).
      - "${PORT:-655}:${PORT:-655}/tcp"
      - "${PORT:-655}:${PORT:-655}/udp"
    volumes:
      - data:/etc/tincstack

volumes:
  # Identity + runtime state. Never bind-mount this into the repository.
  data:
