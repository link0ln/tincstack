# tincstack Linux node -- zero-config.
#
#   docker compose up -d          # on a clean checkout: builds core/, builds the
#                                 # node image, starts one node that configures
#                                 # itself (PLAN.md M1); keys land in the volume
#   ./invite.sh <name>            # one-line invitation for a new peer
#   ./join.sh <invitation>        # on the other host: join with that line
#
# Deploy-time choices come from the environment / .env (see .env.example).
# Nothing is templated; the daemon owns tinc.yaml.
name: tincstack

services:
  core:
    # Build-only. The daemon core from core/Dockerfile.build, consumed by
    # `node` as the named build context `core`. scale: 0 -> never started.
    image: tincstack/core:${TINCSTACK_TAG:-dev}
    build:
      context: ../../../core
      dockerfile: Dockerfile.build
    scale: 0

  node:
    image: tincstack/node:${TINCSTACK_TAG:-dev}
    build:
      context: .
      additional_contexts:
        core: service:core
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NETNAME: ${NETNAME:-tincstack}
      NODE_NAME: ${NODE_NAME:-}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-}
      PORT: ${PORT:-}
      FRONT_PORT: ${FRONT_PORT:-}
      FRONT_PORT_PUBLIC: ${FRONT_PORT_PUBLIC:-}
      OBFS_PORT: ${OBFS_PORT:-}
      OBFS_PORT_PUBLIC: ${OBFS_PORT_PUBLIC:-}
      INVITE: ${INVITE:-}
      LOG_LEVEL: ${LOG_LEVEL:-1}
    ports:
      # A founding node must be reachable here. An invitee with PORT unset or 0
      # only dials out: join.sh adds compose.leaf.yml, which publishes none of
      # these ports (long syntax lets compose.leaf.yml / compose.nofront.yml
      # reset or override ports cleanly even when PORT=0 or FRONT_PORT=0).
      - target: ${PORT:-655}
        published: "${PORT:-655}"
        protocol: tcp
      - target: ${PORT:-655}
        published: "${PORT:-655}"
        protocol: udp
      # The https and quic fronts (docs/transports.md 3.1): TLS and QUIC on 443,
      # where they look like the web, not on tinc's port. All meta and VPN data
      # for the negotiated carrier flow over its single port (FRONT_PORT for
      # https/quic, OBFS_PORT or PORT for obfs, PORT for sf/plain). Host port
      # 443 taken by a web server: set FRONT_PORT to a free one (8443), or set
      # FRONT_PORT=0 with `:compose.nofront.yml` in COMPOSE_FILE to disable
      # fronts completely. A router forwarding an external port: FRONT_PORT_PUBLIC.
      # Separate OBFS_PORT (UDP): add `:compose.obfs.yml` to COMPOSE_FILE so
      # Docker also publishes `${OBFS_PORT}/udp` on the host.
      - target: ${FRONT_PORT:-443}
        published: "${FRONT_PORT:-443}"
        protocol: tcp
      - target: ${FRONT_PORT:-443}
        published: "${FRONT_PORT:-443}"
        protocol: udp
    volumes:
      - data:/etc/tincstack

volumes:
  # Identity + runtime state. Never bind-mount this into the repository.
  data:
