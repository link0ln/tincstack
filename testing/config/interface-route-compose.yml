# Lab for testing/config/interface-route-test.sh: node2 owns a LAN and announces
# it, node1 has the InterfaceRoute for it. Configs are generated by the script.
name: ${IR_PROJECT:-tincstack-ifroute}
services:
  node1:
    image: ${CORE_IMAGE:-tincstack/core:dev}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./run-ifroute/node1:/etc/tincstack"]
    command: ["tincd", "-D", "-d3", "-c", "/etc/tincstack/tinc.yaml"]
    networks:
      ifroute: {ipv4_address: "${IR_SUBNET:-172.28.81}.11"}
  node2:
    image: ${CORE_IMAGE:-tincstack/core:dev}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./run-ifroute/node2:/etc/tincstack"]
    command: ["tincd", "-D", "-d3", "-c", "/etc/tincstack/tinc.yaml"]
    depends_on: [node1]
    networks:
      ifroute: {ipv4_address: "${IR_SUBNET:-172.28.81}.12"}
networks:
  ifroute:
    name: ${IR_PROJECT:-tincstack-ifroute}
    ipam:
      config: [{subnet: "${IR_SUBNET:-172.28.81}.0/24"}]
