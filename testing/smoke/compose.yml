# Two-node smoke test for `make check`: two core nodes with explicit YAML
# configs (generated at run time by run.sh into ./run/, never committed) on one
# compose network; run.sh asserts a ping across the tunnel.
name: wsf-smoke
services:
  node1:
    image: ${CORE_IMAGE:-tincstack/core:ws-f}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./run/node1:/etc/tincstack"]
    command: ["tincd", "-D", "-d3", "-c", "/etc/tincstack/tinc.yaml"]
    networks:
      smoke: {ipv4_address: 172.31.77.11}
  node2:
    image: ${CORE_IMAGE:-tincstack/core:ws-f}
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["./run/node2:/etc/tincstack"]
    command: ["tincd", "-D", "-d3", "-c", "/etc/tincstack/tinc.yaml"]
    depends_on: [node1]
    networks:
      smoke: {ipv4_address: 172.31.77.12}
networks:
  smoke:
    name: wsf-smoke
    ipam:
      config: [{subnet: 172.31.77.0/24}]
