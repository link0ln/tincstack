# tincstack release — a `v*` tag publishes; nothing else does. One tag produces:
#
#   ghcr.io/<owner>/tincstack/core:<tag>   the daemon image (QUIC carrier built in)
#   ghcr.io/<owner>/tincstack/node:<tag>   the compose-ready Linux node
#     both also tagged `latest`
#   tincstack-<tag>-windows-x86_64.zip     tincmgr.exe (the GUI manager, one file)
#                                          plus the standalone tincd.exe/tinc.exe
#   tincstack-<tag>.apk                    the Android app
#   tincstack-<tag>-source.tar.gz          the tree at the tag, for Linux hosts
#                                          (they run it through docker compose)
#
# The images are built, LOADED LOCALLY and smoke-tested first; they are pushed
# only after that passes, so a release never publishes an image nobody ran.
#
# DRY RUN: "Run workflow" from the Actions tab builds and tests everything and
# uploads the artefacts to the workflow run, but pushes no image and creates no
# release. Use it to prove the pipeline before cutting the first real tag.
#
# Linux hosts do not get a binary tarball on purpose: the supported Linux
# deployment is `docker compose` against the published image
# (platforms/linux/docker/compose.release.yml).
#
# Architecture: linux/amd64 only for now. arm64 needs either QEMU (the ngtcp2
# source stage makes that ~10x slower) or an arm64 runner; add it as a matrix
# leg once a first release has gone out on amd64.
#
# FIRST RELEASE, ONE MANUAL STEP: a package that Actions creates in ghcr.io is
# private even when the repository is public, so `docker pull` fails for
# everyone else until the owner sets both packages to Public once (repository →
# Packages → the package → Package settings → Change visibility). After that it
# stays public for every later tag.
#
# Android signing is optional. With the four ANDROID_* secrets set the APK is
# signed by gradle's release signingConfig (app/build.gradle reads
# keystore.properties); without them the job still produces an APK that Android
# will not install at all, and the asset is named `-UNSIGNED-WILL-NOT-INSTALL`
# because a suffix nobody reads is what shipped v0.4.0 in that state.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # create the release, upload assets
  packages: write   # push to ghcr.io

jobs:
  meta:
    name: what this run is
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      core: ${{ steps.v.outputs.core }}
      node: ${{ steps.v.outputs.node }}
    steps:
      - name: Version, and whether anything leaves this run
        id: v
        run: |
          set -eu
          if [ "${{ github.event_name }}" = push ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dryrun-$(echo "${{ github.sha }}" | cut -c1-8)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run — no image is pushed and no release is created"
          fi
          # ghcr paths must be lowercase
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "core=ghcr.io/${repo}/core" >> "$GITHUB_OUTPUT"
          echo "node=ghcr.io/${repo}/node" >> "$GITHUB_OUTPUT"

  images:
    name: linux images (ghcr.io)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build into the local docker daemon, not into the registry: the smoke
      # test below has to run against exactly these bits before anyone can pull
      # them.
      - name: Build core
        uses: docker/build-push-action@v6
        # Without this the action uploads a `<owner>~<repo>~XXXX.dockerbuild`
        # record as a workflow artifact. The release job downloads every
        # artifact of the run, so that blob would both be attached to the
        # release and be one more thing whose download can fail.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: core
          file: core/Dockerfile.build
          load: true
          tags: tincstack/core:rel
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Core sanity
        run: docker run --rm tincstack/core:rel tincd --version | tee /dev/stderr | grep -ci tinc >/dev/null

      # NOT docker/build-push-action: buildx runs in its own container and
      # resolves FROM ${CORE_IMAGE} against the registry, so it tried to pull
      # `tincstack/core:rel` from Docker Hub and the v0.1.0 run died with
      # "pull access denied ... insufficient_scope". The node image is a thin
      # layer on top of the core we just LOADED into the local daemon, so build
      # it with the daemon's own builder, which can see that image. (The core
      # build above stays on buildx for the gha cache; it pulls only public
      # bases.)
      - name: Build node
        run: |
          set -eo pipefail
          docker build --build-arg CORE_IMAGE=tincstack/core:rel \
            -t tincstack/node:rel platforms/linux/docker 2>&1 | tee node-build.log || {
              msg=$(tail -n 40 node-build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=node image build failed::$msg"
              exit 1
            }

      - name: Smoke test the image that is about to be published
        run: |
          set -eo pipefail
          CORE_IMAGE=tincstack/core:rel testing/smoke/run.sh 2>&1 | tee smoke.log || {
            msg=$(tail -n 40 smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=release smoke failed::$msg"
            exit 1
          }

      # The node image adds the zero-config entrypoint on top of the core, so
      # it gets its own check: an empty volume must become a configured,
      # running node with no input at all (PLAN.md M1).
      - name: Node image self-configures from an empty volume
        run: |
          set -eu
          docker run -d --name relnode --cap-add NET_ADMIN \
            --device /dev/net/tun -e PORT=655 tincstack/node:rel
          for _ in $(seq 1 60); do
            # grep -c, not grep -q: GitHub runs every `run:` under
            # `bash -eo pipefail`, and grep -q leaves on the first match, so
            # `docker logs` dies of SIGPIPE and the pipeline reports failure
            # BECAUSE the line was found (see PLAN.md Known Issues).
            docker logs relnode 2>&1 | grep -c ' Ready$' >/dev/null && break
            sleep 1
          done
          docker logs relnode
          docker logs relnode 2>&1 | grep -c ' Ready$' >/dev/null
          docker exec relnode tincstack-cli pid
          docker exec relnode tincstack-cli get Name
          docker rm -f relnode

      - uses: docker/login-action@v3
        if: needs.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push core and node
        if: needs.meta.outputs.publish == 'true'
        run: |
          set -eu
          for img in "${{ needs.meta.outputs.core }}:${{ needs.meta.outputs.version }}" \
                     "${{ needs.meta.outputs.core }}:latest"; do
            docker tag tincstack/core:rel "$img"
            docker push "$img"
          done
          for img in "${{ needs.meta.outputs.node }}:${{ needs.meta.outputs.version }}" \
                     "${{ needs.meta.outputs.node }}:latest"; do
            docker tag tincstack/node:rel "$img"
            docker push "$img"
          done

  windows:
    name: windows x86_64
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cross-build the core with mingw-w64
        run: platforms/windows/build-core-win.sh

      # wintun.dll is a Microsoft-signed driver shim distributed by WireGuard
      # LLC, not something this repository builds or carries. It is fetched
      # here and its Authenticode signature is verified against the system
      # trust store, which is a stronger provenance check than a checksum
      # pinned in this file: the observed SHA-256 is printed for the record,
      # but the gate is "signed by WireGuard LLC and the signature verifies".
      - name: Fetch and verify wintun.dll
        run: |
          set -eu
          curl -fSL --retry 3 --retry-all-errors -o wintun.zip \
            "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          sha256sum wintun.zip
          unzip -q -o wintun.zip -d wintun-src
          dll=$(find wintun-src -type f -name wintun.dll -path '*amd64*' | head -n1)
          test -n "$dll"
          cp "$dll" platforms/windows/resources/wintun.dll
          sha256sum platforms/windows/resources/wintun.dll
          docker run --rm -v "$PWD/platforms/windows/resources:/w:ro" debian:12-slim sh -c '
            set -eu
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends osslsigncode ca-certificates >/dev/null
            osslsigncode verify /w/wintun.dll > /tmp/v.txt 2>&1 || { cat /tmp/v.txt; exit 1; }
            grep -q "O=WireGuard LLC" /tmp/v.txt || { echo "not signed by WireGuard LLC"; cat /tmp/v.txt; exit 1; }
            grep -q "Signature verification: ok" /tmp/v.txt || { cat /tmp/v.txt; exit 1; }
            grep -E "Subject:|Signature verification:|Number of verified" /tmp/v.txt | head -3
          '
        env:
          WINTUN_VERSION: '0.14.1'

      - name: Build tincmgr.exe (Windows CPython + PyInstaller under Wine)
        run: SMOKE=1 platforms/windows/build-exe.sh

      - name: Assert every artefact is a PE32+ binary
        run: |
          mkdir -p dist/windows
          cp platforms/windows/resources/tincd.exe \
             platforms/windows/resources/tinc.exe \
             platforms/windows/dist/tincmgr.exe dist/windows/
          docker run --rm -v "$PWD/dist/windows:/w:ro" debian:12-slim \
            sh -c 'apt-get update >/dev/null \
                   && apt-get install -y --no-install-recommends file >/dev/null \
                   && file /w/tincd.exe /w/tinc.exe /w/tincmgr.exe | tee /dev/stderr \
                      | grep -c "PE32+ executable" | grep -qx 3'

      - name: Package
        run: |
          set -eu
          cp platforms/windows/build-windows.md dist/windows/README-build.md
          cd dist/windows
          sha256sum ./*.exe > SHA256SUMS
          cat SHA256SUMS
          zip -9 "../../tincstack-${{ needs.meta.outputs.version }}-windows-x86_64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tincstack-${{ needs.meta.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error

  android:
    name: android apk
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # No android-actions/setup-android: it is the step that failed on the
      # v0.1.0 tag, and it is not needed -- the ubuntu runner image ships the
      # Android SDK and its cmdline-tools already, and the build itself runs in
      # this repository's own container with that SDK mounted. Locate
      # sdkmanager rather than assume a path, and say which one is used.
      - name: SDK packages the build needs
        run: |
          set -eo pipefail
          sdk=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}
          mgr=$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -z "$mgr" ]; then
            echo "::error title=no sdkmanager::looked under $sdk/cmdline-tools; SDK contents: $(find "$sdk" -maxdepth 1 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "sdkmanager: $mgr"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          yes | "$mgr" --licenses >/dev/null 2>&1 || true
          "$mgr" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tee sdk.log || {
            msg=$(tail -n 30 sdk.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=sdkmanager install failed::$msg"
            exit 1
          }

      # The APK's own version, from the tag. versionCode is monotonic for any
      # semver with minor and patch below 100 (v0.4.1 -> 401); a dry run keeps
      # the gradle defaults. Android blocks an install whose versionCode is
      # below the installed one, so this must never be a constant.
      - name: Version for the APK
        id: apkver
        run: |
          set -eu
          v='${{ needs.meta.outputs.version }}'
          case "$v" in
          v[0-9]*.[0-9]*.[0-9]*)
            n=${v#v}
            maj=${n%%.*}; rest=${n#*.}; min=${rest%%.*}; pat=${rest##*.}
            pat=${pat%%[!0-9]*}
            echo "name=$n" >> "$GITHUB_OUTPUT"
            echo "code=$(( maj * 10000 + min * 100 + pat ))" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::notice::$v is not a vX.Y.Z tag; keeping the gradle default version"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
            ;;
          esac

      # keystore.properties is read by platforms/android/app/build.gradle; it is
      # written here from secrets and never committed. Without the secrets the
      # APK comes out unsigned -- not "less trusted", but uninstallable.
      - name: Signing material (optional)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret; the APK will be unsigned"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > platforms/android/release.keystore
          cat > platforms/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          # Prove the material before spending ten minutes on a build that
          # would die in validateSigningRelease: that the base64 decoded to a
          # keystore, that the password opens it, and that the alias is in it.
          if ! keytool -list -keystore platforms/android/release.keystore \
                       -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >keytool.log 2>&1; then
            msg=$(sed 's/%/%25/g' keytool.log | awk '{printf "%s%%0A", $0}')
            echo "::error title=the signing material is unusable::$msg"
            rm -f platforms/android/release.keystore platforms/android/keystore.properties keytool.log
            exit 1
          fi
          rm -f keytool.log
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The gradle default crypto (openssl) since 2026-09-24: build-core.sh
      # cross-builds OpenSSL 3.5 + ngtcp2 per ABI, so the APK has the https
      # and quic carriers and the legacy protocol. Until then this passed
      # -PtincCrypto=nolegacy, the only thing that built against LibreSSL.
      - name: Build the app in the repository's own build container
        env:
          APK_NAME: ${{ steps.apkver.outputs.name }}
          APK_CODE: ${{ steps.apkver.outputs.code }}
        run: |
          docker build -t tincstack/android-build -f platforms/android/docker/Dockerfile.build platforms/android/docker
          set -eo pipefail
          docker run --rm \
            -v "$PWD":/src \
            -v "$ANDROID_SDK_ROOT":/opt/android-sdk \
            -v /tmp/gradle:/root/.gradle \
            -w /src/platforms/android \
            -e ANDROID_HOME=/opt/android-sdk -e ANDROID_SDK_ROOT=/opt/android-sdk \
            tincstack/android-build ./gradlew --no-daemon \
            ${APK_NAME:+-PtincVersionName="$APK_NAME"} \
            ${APK_CODE:+-PtincVersionCode="$APK_CODE"} \
            assembleRelease \
            2>&1 | tee gradle.log || {
              msg=$(tail -n 40 gradle.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=assembleRelease failed::$msg"
              exit 1
            }

      - name: Collect the APK
        run: |
          set -eu
          apk=$(find platforms/android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$apk"
          if [ "${{ steps.signing.outputs.signed }}" = true ]; then
            # The whole point of the job: an APK nobody can install is worse
            # than no APK, so the signature is asserted here, not assumed.
            signer=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -n1)
            if ! "$signer" verify --print-certs "$apk" >verify.log 2>&1; then
              msg=$(tail -n 20 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=the built APK is not signed::$msg"
              exit 1
            fi
            grep -E 'Signer #1 certificate SHA-256|^Verified using' verify.log || true
            cp "$apk" "tincstack-${{ needs.meta.outputs.version }}.apk"
          else
            # An unsigned APK is not a lesser APK, it is a file Android refuses
            # to install at all ("package appears to be invalid"). v0.4.0 was
            # published this way and the owner hit exactly that. The name has
            # to say so, because the name is all anyone reads on a release page.
            cp "$apk" "tincstack-${{ needs.meta.outputs.version }}-UNSIGNED-WILL-NOT-INSTALL.apk"
            echo "::warning title=unsigned APK::this APK cannot be installed on any Android device; set the four ANDROID_* secrets and cut a new tag"
          fi
          sha256sum tincstack-*.apk

      - name: Never leave signing material in the workspace
        if: always()
        run: rm -f platforms/android/release.keystore platforms/android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: tincstack-*.apk
          if-no-files-found: error

  release:
    name: publish the release
    needs: [meta, images, windows, android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Source archive for Linux hosts
        run: |
          git archive --format=tar.gz \
            --prefix="tincstack-${{ needs.meta.outputs.version }}/" \
            -o "tincstack-${{ needs.meta.outputs.version }}-source.tar.gz" \
            "${{ needs.meta.outputs.version }}"

      # By name, not "everything in the run": the v0.1.0 run died here with
      # "Unable to download artifact(s) ... after 5 retries" while pulling the
      # whole set, and a blanket download also attaches anything else a step
      # happens to upload to the release.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          CORE_IMAGE: ${{ needs.meta.outputs.core }}
          NODE_IMAGE: ${{ needs.meta.outputs.node }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          find assets -type f -print
          cat > notes.md <<EOF
          ## Linux (docker compose)

              curl -LO https://github.com/$REPO/releases/download/$VERSION/tincstack-$VERSION-source.tar.gz
              tar xzf tincstack-$VERSION-source.tar.gz
              cd tincstack-$VERSION/platforms/linux/docker
              export COMPOSE_FILE=compose.release.yml
              TINCSTACK_VERSION=$VERSION docker compose up -d

          The image is pulled, not built:

              $NODE_IMAGE:$VERSION
              $CORE_IMAGE:$VERSION

          Both images were smoke-tested (two-node YAML lab, ping both ways, and a
          zero-config start from an empty volume) before this tag was published.

          ## Windows

          \`tincstack-$VERSION-windows-x86_64.zip\` contains \`tincmgr.exe\`, the
          single-file GUI manager, with the cross-built core and \`wintun.dll\`
          already inside it, plus the standalone \`tincd.exe\` and \`tinc.exe\` for
          command-line use, and \`SHA256SUMS\`.

          \`wintun.dll\` is fetched from https://www.wintun.net/ during the build
          and its Authenticode signature is verified to be WireGuard LLC's before
          it is bundled. **The artefacts are unsigned**, so Windows SmartScreen
          will warn about them.

          ## Android

          The \`.apk\` asset.

          An asset named \`-UNSIGNED-WILL-NOT-INSTALL\` was built without a
          signing key. **Android will refuse to install it** — it reports
          "package appears to be invalid" or "possibly corrupt", which is the
          missing signature and not a damaged download. Sign it locally
          (\`zipalign\` + \`apksigner sign\`), or set the four \`ANDROID_*\`
          repository secrets (see \`platforms/android/readme.md\`) and cut a new
          tag to get an installable one.

          Its core links OpenSSL 3.5 and ngtcp2: the \`https\` and \`quic\`
          carriers and the legacy protocol, as on Linux and Windows.
          EOF
          mapfile -t built < <(find assets -type f)
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error title=no assets::download-artifact produced nothing under assets/"
            exit 1
          fi
          gh release create "$VERSION" \
            --repo "$REPO" \
            --title "tincstack $VERSION" \
            --notes-file notes.md \
            "tincstack-$VERSION-source.tar.gz" \
            "${built[@]}" 2>&1 | tee gh.log || {
              msg=$(tail -n 20 gh.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=gh release create failed::$msg"
              exit 1
            }
